<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Conteúdo — PFE Advogados</title>
<style>
  :root{
    --bg:#f6f6f3;
    --surface:#ffffff;
    --border:#e3e1da;
    --border-soft:#eeece5;
    --text:#232722;
    --muted:#6b6f68;
    --primary:#2563eb;
    --primary-light:#3b76f0;
    --primary-soft:#e8effe;
    --accent:#2563eb;
    --danger:#b2453a;
    --sidebar-bg:#161a22;
    --sidebar-bg-hover:rgba(255,255,255,.07);
    --sidebar-text:#c7ccd6;
    --sidebar-text-dim:#7d8494;
    --sidebar-w:244px;
    --radius:10px;
    --radius-lg:18px;
    --shadow:0 1px 2px rgba(20,20,15,.05), 0 4px 14px rgba(20,20,15,.04);
    --shadow-md:0 10px 28px rgba(20,20,15,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--primary-light);}
  h1,h2,h3{margin:0;}
  button{font-family:inherit;cursor:pointer;}

  /* ===== Shell: sidebar + main ===== */
  .app-shell{display:flex;min-height:100vh;align-items:stretch;}

  .sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30;}
  .sidebar-brand{display:flex;flex-direction:column;gap:8px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
  .brand-row{display:flex;align-items:center;gap:8px;}
  .brand-logo-chip{background:#fff;border-radius:10px;padding:9px 12px;flex:1;min-width:0;display:flex;align-items:center;}
  .brand-logo-img{width:100%;height:auto;display:block;}
  .sidebar-brand .brand-sub{font-size:11px;color:var(--sidebar-text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px;}
  .sidebar-close-btn{display:none;margin-left:auto;background:transparent;border:none;color:var(--sidebar-text-dim);font-size:18px;cursor:pointer;padding:4px 6px;line-height:1;}

  .sidebar-nav{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px;}

  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,13,10,.45);z-index:25;}
  .sidebar-backdrop.show{display:block;}

  .sidebar-footer{padding:12px 10px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px;}
  .sidebar-footer .sync-line{color:var(--sidebar-text-dim);font-size:11.5px;text-align:center;padding-bottom:4px;cursor:pointer;}
  .sidebar-footer .sync-line:hover{color:#fff;}
  .sidebar-footer .btn-ghost{width:100%;justify-content:center;background:rgba(255,255,255,.06);color:var(--sidebar-text);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;font-size:12.5px;display:flex;align-items:center;gap:6px;}
  .sidebar-footer .btn-ghost:hover{background:rgba(255,255,255,.12);color:#fff;}

  .app-main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{display:none;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:15;align-items:center;padding:12px 14px;}
  .sidebar-toggle-btn{display:flex;background:transparent;border:1px solid var(--border);border-radius:8px;width:34px;height:34px;align-items:center;justify-content:center;cursor:pointer;font-size:16px;}

  main{max-width:1180px;margin:0 auto;padding:22px 20px 50px;width:100%;}

  /* ===== Sidebar nav links (repurposed .tab-btn) ===== */
  .tab-btn{padding:9px 10px;border:1px solid transparent;border-radius:9px;cursor:pointer;color:var(--sidebar-text);font-size:13px;white-space:nowrap;background:transparent;display:flex;align-items:center;gap:9px;font-family:inherit;width:100%;text-align:left;}
  .tab-btn:hover{background:var(--sidebar-bg-hover);color:#fff;}
  .tab-btn.active{background:var(--primary);color:#fff;font-weight:600;}

  .panel-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .panel-title{font-size:19px;font-weight:600;}
  .panel-sub{color:var(--muted);font-size:13px;margin-top:2px;}

  .btn-primary{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:9px 15px;font-size:13.5px;font-weight:500;}
  .btn-primary:hover{background:var(--primary-light);}
  .btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 13px;font-size:13px;}
  .btn-secondary:hover{border-color:#c8c6bd;background:#fbfaf7;}
  .btn-secondary.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .btn-icon{background:none;border:none;color:var(--muted);font-size:14px;padding:4px 6px;border-radius:6px;}
  .btn-icon:hover{background:#f1efe9;color:var(--text);}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .search-input{border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:13.5px;min-width:220px;flex:1;background:var(--surface);}
  .search-input:focus{outline:2px solid var(--primary-light);outline-offset:-1px;}

  .filter-pills{display:flex;gap:6px;flex-wrap:wrap;}

  /* Cards / list */
  .card-list{display:flex;flex-direction:column;gap:10px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-title{font-size:14.5px;font-weight:600;}
  .card-meta{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .card-body{font-size:13.5px;color:#3c403a;margin-top:8px;white-space:pre-wrap;}
  .card-actions{display:flex;gap:4px;flex-shrink:0;}
  .empty-state{color:var(--muted);font-size:13.5px;text-align:center;padding:40px 10px;border:1px dashed var(--border);border-radius:var(--radius);background:var(--surface);}

  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap;}
  .badge-gray{background:#eceae4;color:#5c5f58;}
  .badge-blue{background:#e2ecf5;color:#2a5b83;}
  .badge-purple{background:#ece3f5;color:#5c3d8a;}
  .badge-orange{background:#faeadb;color:#9a5b1f;}
  .badge-teal{background:#dcefe9;color:#1f6e58;}
  .badge-green{background:#dff0dd;color:#2c7a2c;}
  .badge-red{background:#f6dedb;color:#a13c2f;}

  /* ===== Visão Geral: greeting banner + KPI cards ===== */
  .dash-greeting{background:linear-gradient(135deg, #2563eb 0%, #0f1729 130%);color:#fff;border-radius:var(--radius-lg);padding:26px 28px;margin-bottom:20px;position:relative;overflow:hidden;}
  .dash-greeting::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06);}
  .dash-greeting .dg-date{font-size:12px;opacity:.85;text-transform:capitalize;margin-bottom:8px;position:relative;}
  .dash-greeting h2{margin:0 0 4px;font-size:23px;font-weight:700;position:relative;}
  .dash-greeting p{margin:0;opacity:.88;font-size:13px;position:relative;}

  .dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .dash-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:box-shadow .15s, transform .15s;box-shadow:var(--shadow);}
  .dash-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .dash-card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:9px;}
  .dash-icon{width:30px;height:30px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .dash-total{font-size:23px;font-weight:700;color:var(--text);}
  .dash-sub{font-size:12px;color:var(--muted);margin-top:4px;}

  /* Calendar */
  .cal-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .cal-nav{display:flex;align-items:center;gap:6px;}
  .cal-label{font-size:14.5px;font-weight:600;min-width:150px;text-align:center;}
  .cal-modes{display:flex;gap:6px;}
  .cal-scroll{overflow-x:auto;padding-bottom:4px;}
  .cal-grid-month{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));gap:8px;min-width:980px;}
  .cal-weekday{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:2px 4px;}
  .cal-cell{background:var(--surface);border:1px solid var(--border);border-radius:10px;min-height:150px;padding:8px;display:flex;flex-direction:column;gap:5px;cursor:pointer;}
  .cal-cell:hover{background:#f9f8f5;}
  .cal-cell.other-month{opacity:.4;}
  .cal-cell.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .cal-cell-head{display:flex;justify-content:space-between;align-items:center;}
  .cal-daynum{font-size:13px;font-weight:600;color:var(--muted);}
  .cal-add{background:none;border:none;color:var(--muted);font-size:14px;line-height:1;padding:0 3px;}
  .cal-add:hover{color:var(--primary);}
  .cal-chip{font-size:11.5px;padding:4px 7px;border-radius:6px;background:#eceae4;color:#3c403a;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border:none;width:100%;}
  .cal-chip:hover{filter:brightness(0.96);}
  .cal-more{font-size:11px;color:var(--muted);padding-left:2px;font-weight:600;}

  .cal-grid-week{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:8px;min-width:1160px;}
  .cal-week-col{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:440px;cursor:pointer;}
  .cal-week-col:hover{background:#f9f8f5;}
  .cal-week-col.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .cal-week-head{font-size:12px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border);padding-bottom:6px;}
  .cal-week-head span{display:block;font-weight:400;color:var(--muted);font-size:11px;}
  .cal-week-item{background:#f6f6f3;border-radius:6px;padding:6px 7px;font-size:12px;cursor:pointer;}
  .cal-week-item:hover{background:#eeece6;}
  .cal-week-item .wi-title{font-weight:600;}
  .cal-week-item .wi-meta{color:var(--muted);font-size:10.5px;margin-top:2px;}

  .agenda-wrap .panel-sub{margin-bottom:10px;}
  .agenda-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;margin:10px 0 16px;}
  .agenda-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;background:#f6f6f3;cursor:pointer;}
  .agenda-row:hover{background:#eeece6;}
  .agenda-title{font-size:13px;font-weight:600;flex:1;}
  .agenda-empty{color:var(--muted);font-size:13px;padding:10px 4px;}
  .cal-week-add{margin-top:auto;background:none;border:1px dashed var(--border);border-radius:6px;color:var(--muted);font-size:12px;padding:5px;}
  .cal-week-add:hover{color:var(--primary);border-color:var(--primary-light);}

  .upcoming{margin-top:22px;}
  .upcoming h3{font-size:13.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;font-weight:700;}
  .upcoming-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13px;}
  .upcoming-row:hover{border-color:#c8c6bd;}
  .upcoming-date{font-weight:700;color:var(--primary);min-width:44px;font-size:12.5px;}

  /* Sub tabs (Formatos) */
  .subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,22,18,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:26px 14px;overflow-y:auto;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:12px;max-width:520px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.2);}
  .modal h2{font-size:16px;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px;}
  .field input[type=text],.field input[type=date],.field input[type=url],.field select,.field textarea{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13.5px;font-family:inherit;background:#fdfdfc;
  }
  .field textarea{resize:vertical;min-height:80px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary-light);outline-offset:-1px;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .25s ease;z-index:60;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .hint-banner{font-size:12px;color:var(--sidebar-text-dim);margin-top:6px;}

  .sync-modal .help-text{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 14px;}
  .sync-status-box{background:#f6f6f3;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px;font-weight:600;}
  .sync-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  @media (max-width:880px){
    .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow-md);}
    .sidebar.open{transform:translateX(0);}
    .sidebar-close-btn{display:block;}
    .topbar{display:flex;}
    main{padding:16px 14px 40px;}
  }

  @media (max-width:640px){
    .cal-label{min-width:auto;}
    .modal{max-width:100%;border-radius:10px 10px 0 0;}
    .dash-greeting{padding:20px;}
  }
</style>
</head>

  function loadState(){

      if(raw){
        var parsed = JSON.parse(raw);
        state.data = Object.assign(defaultData(), parsed);

        var d = defaultData();

      } else {
        state.data = defaultData();

      }
    }catch(e){
      console.error('Erro ao carregar dados salvos, iniciando do zero.', e);

  /* ---------------------------------------------------------
     Sincronização com GitHub (repositório privado)
     Mesmo esquema usado no painel do escritório: os dados de
     verdade ficam guardados num repositório PRIVADO do GitHub,
     lidos/escritos com um token de acesso pessoal que só você
     tem. Sem o token, ninguém consegue ler nem alterar os dados
     — mesmo que ache o link público do site.
  --------------------------------------------------------- */
  var GH_OWNER = 'leonamegas';
  var GH_REPO = 'central-conteudo-dados';
  var GH_PATH = 'dados.json';
  var GH_TOKEN_KEY = 'centralConteudo_gh_token';
  var ghToken = localStorage.getItem(GH_TOKEN_KEY) || '';
  var ghSha = null;
  var syncTimer = null;
  var syncState = 'off'; // off | syncing | ok | error
  var syncMsg = '';

  function b64EncodeUnicode(str){
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(_, p){ return String.fromCharCode('0x'+p); }));
  }
  function b64DecodeUnicode(str){
    return decodeURIComponent(atob(str).split('').map(function(c){ return '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2); }).join(''));
  }
  function ghApiUrl(){ return 'https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_PATH; }
  function ghHeaders(){ return {'Authorization':'Bearer '+ghToken, 'Accept':'application/vnd.github+json'}; }

  function setSyncState(s, msg){
    syncState = s;
    syncMsg = msg || '';
    renderSyncUI();
  }

  function ghFetchRemote(){
    return fetch(ghApiUrl() + '?t=' + Date.now(), {headers: ghHeaders()}).then(function(res){
      if(res.status===404){ ghSha=null; return {notFound:true}; }
      if(res.status===401 || res.status===403){ setSyncState('error','Token inválido ou sem permissão.'); return null; }
      if(!res.ok){ setSyncState('error','Erro ao buscar (HTTP '+res.status+').'); return null; }
      return res.json().then(function(data){
        ghSha = data.sha;
        var json = b64DecodeUnicode((data.content||'').replace(/\n/g,''));
        return {data: JSON.parse(json)};
      });
    }).catch(function(){ setSyncState('error','Sem conexão com o GitHub.'); return null; });
  }

  function ghPushRemote(){
    if(!ghToken) return Promise.resolve();
    setSyncState('syncing');
    var body = {
      message: 'Atualização — ' + new Date().toISOString(),
      content: b64EncodeUnicode(JSON.stringify(state.data, null, 2))
    };
    if(ghSha) body.sha = ghSha;
    return fetch(ghApiUrl(), {
      method:'PUT',
      headers: Object.assign({}, ghHeaders(), {'Content-Type':'application/json'}),
      body: JSON.stringify(body)
    }).then(function(res){
      if(res.status===401 || res.status===403){ setSyncState('error','Token inválido ou sem permissão.'); return; }
      if(res.status===409){
        return ghFetchRemote().then(function(remote){
          if(remote && !remote.notFound) return ghPushRemote();
        });
      }
      if(!res.ok){ setSyncState('error','Erro ao salvar (HTTP '+res.status+').'); return; }
      return res.json().then(function(data){
        ghSha = data.content.sha;
        setSyncState('ok');
      });
    }).catch(function(){ setSyncState('error','Sem conexão com o GitHub.'); });
  }

  function scheduleSync(){
    if(!ghToken) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(ghPushRemote, 1200);
  }

  function initSync(){
    if(!ghToken){ setSyncState('off'); return; }
    setSyncState('syncing');
    ghFetchRemote().then(function(remote){
      if(!remote) return;
      if(remote.notFound){
        ghPushRemote(); // primeiro aparelho a conectar: cria o arquivo com os dados atuais
      } else {
        var d = defaultData();
        state.data = Object.assign(d, remote.data);
        Object.keys(d).forEach(function(k){ if(!state.data[k]) state.data[k]=[]; });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
        renderApp();
        setSyncState('ok');
      }
    });
  }

  function renderSyncUI(){
    var line = document.getElementById('syncLine');
    if(line){
      var map = {
        off: '⚪ Sem sincronização',
        syncing: '🔄 Sincronizando…',
        ok: '🟢 Sincronizado',
        error: '🔴 Erro de sincronização'
      };
      line.textContent = map[syncState] || '';
      line.onclick = openSyncModal;
    }
    var box = document.getElementById('syncStatusBox');
    if(box){
      var map2 = {
        off: {text:'Ainda não conectado neste navegador.', color:'#555'},
        syncing: {text:'Sincronizando…', color:'#92400e'},
        ok: {text:'Conectado e sincronizado.', color:'#166534'},
        error: {text:'Erro: ' + (syncMsg||'falha desconhecida'), color:'#b91c1c'}
      };
      var m = map2[syncState] || map2.off;
      box.style.color = m.color;

    }
  }

  function openSyncModal(){
    modalBox.innerHTML = '';
    modalBox.classList.add('sync-modal');
    var wrap = el('div', {});
    wrap.appendChild(text('h2', null, '🔒 Sincronização (GitHub privado)'));
    wrap.appendChild(el('p', {class:'help-text'}, [document.createTextNode(
      'Guarda os dados de verdade num repositório PRIVADO do GitHub (' + GH_OWNER + '/' + GH_REPO + '), em vez de só neste navegador. Assim ninguém que só tenha o link do site consegue ver ou mexer nos seus dados — só quem tiver o token de acesso. Também sincroniza entre aparelhos: cole o mesmo token em outro navegador/celular pra ver os mesmos dados.'
    )]));
    var statusBox = el('div', {id:'syncStatusBox', class:'sync-status-box'});
    wrap.appendChild(statusBox);

    var fieldWrap = el('div', {class:'field'});
    fieldWrap.appendChild(text('label', null, 'Token de acesso do GitHub'));
    var tokenInput = document.createElement('input');
    tokenInput.type = 'password';
    tokenInput.id = 'ghTokenInput';
    tokenInput.placeholder = 'github_pat_...';
    tokenInput.value = ghToken;
    fieldWrap.appendChild(tokenInput);
    wrap.appendChild(fieldWrap);

    var actions = el('div', {class:'sync-actions'});
    var connectBtn = el('button', {type:'button', class:'btn-primary'}, [text('span',null,'Salvar e conectar')]);
    connectBtn.addEventListener('click', function(){
      var v = tokenInput.value.trim();
      if(!v){ toast('Cole o token de acesso do GitHub.'); return; }
      ghToken = v;
      localStorage.setItem(GH_TOKEN_KEY, ghToken);
      ghSha = null;
      initSync();
    });
    var testBtn = el('button', {type:'button', class:'btn-secondary'}, [text('span',null,'Testar conexão')]);
    testBtn.addEventListener('click', function(){
      if(!ghToken){ toast('Cole e salve um token primeiro.'); return; }
      initSync();
    });
    var disconnectBtn = el('button', {type:'button', class:'btn-secondary', style:'color:var(--danger);'}, [text('span',null,'Desconectar')]);
    disconnectBtn.addEventListener('click', function(){
      if(!confirm('Desconectar a sincronização neste navegador? Os dados salvos aqui localmente continuam, mas não vão mais atualizar automaticamente com o GitHub.')) return;
      ghToken = '';
      ghSha = null;
      localStorage.removeItem(GH_TOKEN_KEY);
      tokenInput.value = '';
      setSyncState('off');
    });
    actions.appendChild(connectBtn);
    actions.appendChild(testBtn);
    actions.appendChild(disconnectBtn);
    wrap.appendChild(actions);

    var closeRow = el('div', {class:'modal-actions'});
    var closeBtn = el('button', {type:'button', class:'btn-secondary'}, [text('span',null,'Fechar')]);
    closeBtn.addEventListener('click', closeModal);
    closeRow.appendChild(document.createElement('div'));
    closeRow.appendChild(closeBtn);
    wrap.appendChild(closeRow);

    modalBox.appendChild(wrap);
    modalOverlay.classList.add('open');
    renderSyncUI();
  }

  /* ---------------------------------------------------------
     Helpers de DOM
  --------------------------------------------------------- */
  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k==='class') e.className = attrs[k];
      else if(k==='html') e.innerHTML = attrs[k];
      else if(k.indexOf('on')===0 && typeof attrs[k]==='function') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }
  function text(tag, cls, str){ var e=document.createElement(tag); if(cls) e.className=cls; e.textContent=str; return e; }
  function esc(s){ return (s||'').toString().replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  /* ---------------------------------------------------------
     Modal genérico
  --------------------------------------------------------- */
  var modalOverlay = document.getElementById('modalOverlay');
  var modalBox = document.getElementById('modalBox');

  function closeModal(){
    modalOverlay.classList.remove('open');
    modalBox.innerHTML = '';
    modalBox.classList.remove('sync-modal');
    modalBox.classList.remove('agenda-modal');
  }
  modalOverlay.addEventListener('click', function(e){ if(e.target===modalOverlay) closeModal(); });

  function openModal(opts){
    // opts: {title, schema, initial, onSave, onDelete}
    var schema = opts.schema, initial = opts.initial || {};
    modalBox.innerHTML = '';
    var form = el('form', {class:'modal-form'});
    form.appendChild(text('h2', null, opts.title));

    var inputs = {};
    schema.fields.forEach(function(f){
      var wrap = el('div', {class:'field'});
      wrap.appendChild(text('label', null, f.label + (f.required?' *':'')));
      var input;
      if(f.type==='textarea'){
        input = document.createElement('textarea');
        if(f.big) input.style.minHeight = '160px';
        input.value = initial[f.key] || '';
      } else if(f.type==='select'){
        input = document.createElement('select');
        f.options.forEach(function(o){
          var opt = document.createElement('option');
          opt.value = o; opt.textContent = o;
          if(initial[f.key]===o) opt.selected = true;
          input.appendChild(opt);
        });
        if(!initial[f.key] && f.options.length) input.value = f.options[0];
      } else if(f.type==='select-teses'){
        input = document.createElement('select');
        var noneOpt = document.createElement('option');
        noneOpt.value=''; noneOpt.textContent='— nenhuma —';
        input.appendChild(noneOpt);
        (state.data.teses||[]).forEach(function(t){
          var opt = document.createElement('option');
          opt.value = t.titulo; opt.textContent = t.titulo;
          if(initial[f.key]===t.titulo) opt.selected = true;
          input.appendChild(opt);
        });
      } else {
        input = document.createElement('input');
        input.type = f.type==='url' ? 'url' : (f.type==='date' ? 'date' : 'text');
        input.value = initial[f.key] || '';
      }
      input.name = f.key;
      if(f.required) input.required = true;
      wrap.appendChild(input);
      inputs[f.key] = input;
      form.appendChild(wrap);
    });

    var actions = el('div', {class:'modal-actions'});
    var leftActions = el('div', {style:'display:flex;gap:8px;'});
    if(opts.onDelete){
      var delBtn = el('button', {type:'button', class:'btn-secondary', style:'color:var(--danger);border-color:#e8c9c4;'}, [text('span',null,'Excluir')]);
      delBtn.addEventListener('click', function(){
        if(confirm('Excluir este item? Essa ação não pode ser desfeita.')){
          opts.onDelete();
          closeModal();
        }
      });
      leftActions.appendChild(delBtn);
    }
    var rightActions = el('div', {style:'display:flex;gap:8px;'});
    var cancelBtn = el('button', {type:'button', class:'btn-secondary'}, [text('span',null,'Cancelar')]);
    cancelBtn.addEventListener('click', closeModal);
    var saveBtn = el('button', {type:'submit', class:'btn-primary'}, [text('span',null,'Salvar')]);
    rightActions.appendChild(cancelBtn);
    rightActions.appendChild(saveBtn);
    actions.appendChild(leftActions);
    actions.appendChild(rightActions);
    form.appendChild(actions);

    form.addEventListener('submit', function(e){
      e.preventDefault();
      var out = {};
      var ok = true;
      schema.fields.forEach(function(f){
        var v = inputs[f.key].value.trim();
        if(f.required && !v) ok = false;
        out[f.key] = v;
      });
      if(!ok){ toast('Preencha os campos obrigatórios.'); return; }
      opts.onSave(out);
      closeModal();
    });

    modalBox.appendChild(form);
    modalOverlay.classList.add('open');
    var firstInput = form.querySelector('input,select,textarea');
    if(firstInput) setTimeout(function(){ firstInput.focus(); }, 30);
  }

  function addItem(collection, data){
    data.id = uid();
    state.data[collection].push(data);
    saveState();
  }
  function updateItem(collection, id, data){
    var arr = state.data[collection];
    var idx = arr.findIndex(function(i){ return i.id===id; });
    if(idx>-1){ data.id = id; arr[idx] = data; saveState(); }
  }
  function deleteItem(collection, id){
    state.data[collection] = state.data[collection].filter(function(i){ return i.id!==id; });
    saveState();
  }

    var schema = SCHEMAS[collection];
    openModal({
      title: 'Novo · ' + schema.label,
      schema: schema,
      initial: prefill || {},
      onSave: function(data){
        addItem(collection, data);
        toast(schema.label + ' adicionado.');
        renderApp();
      }
    });
  }
  function openEditModal(collection, item){
    var schema = SCHEMAS[collection];
    openModal({
      title: 'Editar · ' + schema.label,
      schema: schema,
      initial: item,
      onSave: function(data){
        updateItem(collection, item.id, data);
        toast('Alterações salvas.');
        renderApp();

      onDelete: function(){

        toast(schema.label + ' excluído.');

    var closeBtn = el('button', {type:'button', class:'btn-secondary'}, [text('span',null,'Fechar')]);
    closeBtn.addEventListener('click', closeModal);
    var addBtn = el('button', {type:'button', class:'btn-primary'}, [text('span',null,'+ Novo ' + schema.label)]);
    addBtn.addEventListener('click', function(){ closeModal(); openAddModal(collection, {date: dateISO}); });
    rightActions.appendChild(closeBtn);
    rightActions.appendChild(addBtn);
    actions.appendChild(rightActions);
    wrap.appendChild(actions);
    modalBox.appendChild(wrap);
    modalOverlay.classList.add('open');
  }

  /* ---------------------------------------------------------
     Render: aba Calendário (Posts / Stories)
  --------------------------------------------------------- */
  function renderCalendarTab(container, collection){
    var schema = SCHEMAS[collection];
    var calState = state.cal[collection];
    var items = state.data[collection];

    container.appendChild(el('div', {class:'panel-header'}, [
      el('div', {}, [
        text('div', 'panel-title', schema.label + 's'),
        text('div', 'panel-sub', collection==='posts' ? 'Calendário de posts do feed' : 'Calendário de stories')
      ]),
      (function(){
        var b = el('button', {class:'btn-primary'}, [text('span',null,'+ Novo '+schema.label)]);
        b.addEventListener('click', function(){ openAddModal(collection, {date: calState.viewDate}); });
        return b;
      })()
    ]));

    // Toolbar: modo + navegação
    var toolbar = el('div', {class:'cal-toolbar'});
    var modes = el('div', {class:'cal-modes'});
    ['month','week'].forEach(function(m){
      var b = el('button', {class:'btn-secondary'+(calState.mode===m?' active':'')}, [text('span',null, m==='month'?'Mês':'Semana')]);
      b.addEventListener('click', function(){ calState.mode=m; renderApp(); });
      modes.appendChild(b);
    });

    var nav = el('div', {class:'cal-nav'});
    var prevBtn = el('button', {class:'btn-secondary'}, [text('span',null,'‹')]);
    var todayBtn = el('button', {class:'btn-secondary'}, [text('span',null,'Hoje')]);
    var nextBtn = el('button', {class:'btn-secondary'}, [text('span',null,'›')]);
    var viewD = fromISO(calState.viewDate);
    var label = calState.mode==='month'
      ? MONTHS[viewD.getMonth()] + ' de ' + viewD.getFullYear()
      : (function(){
          var start = startOfWeekMonday(viewD), end = addDays(start,6);
          return 'Semana de ' + fmtShort(start) + ' a ' + fmtShort(end);
        })();

    prevBtn.addEventListener('click', function(){
      var d = fromISO(calState.viewDate);
      if(calState.mode==='month') d.setMonth(d.getMonth()-1); else d = addDays(d,-7);
      calState.viewDate = toISO(d); renderApp();
    });
    nextBtn.addEventListener('click', function(){
      var d = fromISO(calState.viewDate);
      if(calState.mode==='month') d.setMonth(d.getMonth()+1); else d = addDays(d,7);
      calState.viewDate = toISO(d); renderApp();
    });
    todayBtn.addEventListener('click', function(){ calState.viewDate = todayISO(); renderApp(); });

    nav.appendChild(prevBtn);
    nav.appendChild(todayBtn);
    nav.appendChild(nextBtn);
    nav.appendChild(text('div','cal-label',label));

    toolbar.appendChild(nav);
    toolbar.appendChild(modes);
    container.appendChild(toolbar);

    var scrollWrap = el('div', {class:'cal-scroll'});

    if(calState.mode==='month'){
      var grid = el('div', {class:'cal-grid-month'});
      WEEKDAYS.forEach(function(w){ grid.appendChild(text('div','cal-weekday',w)); });
      var gridStart = startOfMonthGrid(viewD);
      var todayStr = todayISO();
      for(var i=0;i<42;i++){
        var cellDate = addDays(gridStart,i);
        var cellISO = toISO(cellDate);
        var inMonth = cellDate.getMonth()===viewD.getMonth();
        var cell = el('div', {class:'cal-cell'+(inMonth?'':' other-month')+(cellISO===todayStr?' is-today':'')});
        cell.addEventListener('click', function(iso){ return function(){ openDayAgendaModal(collection, iso); }; }(cellISO));
        var head = el('div', {class:'cal-cell-head'}, [text('div','cal-daynum',String(cellDate.getDate()))]);
        var addBtn = el('button', {class:'cal-add', title:'Adicionar'}, [document.createTextNode('+')]);
        addBtn.addEventListener('click', function(iso){ return function(e){ e.stopPropagation(); openAddModal(collection, {date: iso}); }; }(cellISO));
        head.appendChild(addBtn);
        cell.appendChild(head);

        var dayItems = items.filter(function(it){ return it.date===cellISO; });
        dayItems.slice(0,4).forEach(function(it){
          var chip = el('button', {class:'cal-chip'}, [document.createTextNode(it.tema || it.titulo || it.referencia || it.texto || '(sem título)')]);
          chip.addEventListener('click', function(item){ return function(e){ e.stopPropagation(); openEditModal(collection, item); }; }(it));
          cell.appendChild(chip);
        });
        if(dayItems.length>4) cell.appendChild(text('div','cal-more', '+ '+(dayItems.length-4)+' mais'));

        grid.appendChild(cell);
      }
      scrollWrap.appendChild(grid);
    } else {
      var wgrid = el('div', {class:'cal-grid-week'});
      var wStart = startOfWeekMonday(viewD);
      var todayStr2 = todayISO();
      for(var j=0;j<7;j++){
        var d = addDays(wStart,j);
        var dISO = toISO(d);
        var col = el('div', {class:'cal-week-col'+(dISO===todayStr2?' is-today':'')});
        col.addEventListener('click', function(iso){ return function(){ openDayAgendaModal(collection, iso); }; }(dISO));
        col.appendChild(el('div', {class:'cal-week-head'}, [
          document.createTextNode(WEEKDAYS[j]),
          text('span',null,fmtShort(d))
        ]));
        var dItems = items.filter(function(it){ return it.date===dISO; });
        dItems.forEach(function(it){
          var row = el('div', {class:'cal-week-item'});
          row.appendChild(text('div','wi-title', it.tema || it.titulo || it.referencia || (it.texto||'').slice(0,40) || '(sem título)'));
          var metaParts = [];
          if(it.plataforma) metaParts.push(it.plataforma);
          if(it.status) metaParts.push(it.status);
          row.appendChild(text('div','wi-meta', metaParts.join(' · ')));
          row.addEventListener('click', function(item){ return function(e){ e.stopPropagation(); openEditModal(collection, item); }; }(it));
          col.appendChild(row);
        });
        var wAdd = el('button', {class:'cal-week-add'}, [document.createTextNode('+ novo')]);
        wAdd.addEventListener('click', function(iso){ return function(e){ e.stopPropagation(); openAddModal(collection, {date: iso}); }; }(dISO));
        col.appendChild(wAdd);
        wgrid.appendChild(col);
      }
      scrollWrap.appendChild(wgrid);
    }

    container.appendChild(scrollWrap);

    // Próximos
    var upcoming = items.filter(function(it){ return it.date >= todayISO(); })
      .sort(function(a,b){ return a.date<b.date?-1:1; }).slice(0,5);
    if(upcoming.length){
      var up = el('div', {class:'upcoming'});
      up.appendChild(text('h3',null,'Próximos'));
      upcoming.forEach(function(it){
        var row = el('div', {class:'upcoming-row'});
        row.appendChild(text('div','upcoming-date', fmtShort(fromISO(it.date))));
        row.appendChild(document.createTextNode(it.tema || it.titulo || '(sem título)'));
        if(it.status){ var b=text('span','badge '+(STATUS_COLOR[it.status]||'badge-gray'),it.status); b.style.marginLeft='auto'; row.appendChild(b); }
        row.addEventListener('click', function(item){ return function(){ openEditModal(collection, item); }; }(it));
        up.appendChild(row);
      });
      container.appendChild(up);
    }
  }

  /* ---------------------------------------------------------
     Render: lista genérica (Teses, Pautas, Formatos, Reposts, Ganchos)
  --------------------------------------------------------- */
  function renderListTab(container, collection, opts){
    opts = opts || {};
    var schema = SCHEMAS[collection];
    var items = state.data[collection].slice();

    if(!opts.hideHeader){
      container.appendChild(el('div', {class:'panel-header'}, [
        el('div', {}, [
          text('div', 'panel-title', opts.title || (schema.label + 's')),
          opts.subtitle ? text('div', 'panel-sub', opts.subtitle) : document.createTextNode('')
        ]),
        (function(){
          var b = el('button', {class:'btn-primary'}, [text('span',null,'+ Novo '+schema.label)]);
          b.addEventListener('click', function(){ openAddModal(collection); });
          return b;
        })()
      ]));
    } else {
      var miniHeader = el('div', {style:'display:flex;justify-content:flex-end;margin-bottom:12px;'});
      var b2 = el('button', {class:'btn-primary'}, [text('span',null,'+ Novo '+schema.label)]);
      b2.addEventListener('click', function(){ openAddModal(collection); });
      miniHeader.appendChild(b2);
      container.appendChild(miniHeader);
    }

    var toolbar = el('div', {class:'toolbar'});
    if(opts.search){
      var input = el('input', {class:'search-input', id:'searchInput', type:'text', placeholder:opts.search.placeholder});
      input.value = opts.search.get();
      input.addEventListener('input', function(){
        var pos = input.selectionStart;
        opts.search.set(input.value);
        renderApp();
        var newInput = document.getElementById('searchInput');
        if(newInput){
          newInput.focus();
          try{ newInput.setSelectionRange(pos,pos); }catch(e){}
        }
      });
      toolbar.appendChild(input);
    }
    if(opts.filter){
      var pills = el('div', {class:'filter-pills'});
      opts.filter.options.forEach(function(o){
        var b = el('button', {class:'btn-secondary'+(opts.filter.get()===o?' active':'')}, [text('span',null,o)]);
        b.addEventListener('click', function(){ opts.filter.set(o); renderApp(); });
        pills.appendChild(b);
      });
      toolbar.appendChild(pills);
    }
    if(toolbar.children.length) container.appendChild(toolbar);

    if(opts.search){
      var q = opts.search.get().toLowerCase().trim();
      if(q){
        items = items.filter(function(it){
          return Object.keys(it).some(function(k){ return (''+it[k]).toLowerCase().indexOf(q)>-1; });
        });
      }
    }
    if(opts.filter && opts.filter.get() !== opts.filter.options[0]){
      var fval = opts.filter.get();
      items = items.filter(function(it){ return it[opts.filter.key]===fval || (fval==='Ambos' && it[opts.filter.key]==='Ambos'); });
    }

    var list = el('div', {class:'card-list'});
    if(!items.length){
      list.appendChild(el('div', {class:'empty-state'}, [document.createTextNode('Nada por aqui ainda. Clique em "+ Novo '+schema.label+'" para começar.')]));
    } else {
      items.forEach(function(it){
        var card = el('div', {class:'card'});
        var top = el('div', {class:'card-top'});
        var left = el('div', {});
        var titleText = it.titulo || it.referencia || (it.texto ? it.texto.slice(0,70) : '(sem título)');
        left.appendChild(text('div','card-title', titleText));
        var metaParts = [];
        if(it.area) metaParts.push(it.area);
        if(it.plataforma) metaParts.push(it.plataforma);
        if(it.tags) metaParts.push(it.tags);
        if(metaParts.length) left.appendChild(text('div','card-meta', metaParts.join(' · ')));
        top.appendChild(left);

        var right = el('div', {style:'display:flex;align-items:center;gap:8px;'});
        if(it.status) right.appendChild(text('span','badge '+(STATUS_COLOR[it.status]||'badge-gray'), it.status));
        if(it.tipo) right.appendChild(text('span','badge badge-blue', it.tipo));
        var editBtn = el('button', {class:'btn-icon', title:'Editar'}, [document.createTextNode('✎')]);
        editBtn.addEventListener('click', function(item){ return function(){ openEditModal(collection, item); }; }(it));
        right.appendChild(editBtn);
        top.appendChild(right);
        card.appendChild(top);

        var bodyText = it.texto || it.roteiro || it.conteudo || it.descricao || it.specs || '';
        if(bodyText && it.titulo){ // evita duplicar quando o título já é o próprio texto (ganchos)
          card.appendChild(text('div','card-body', bodyText.length>220 ? bodyText.slice(0,220)+'…' : bodyText));
        } else if(bodyText && !it.titulo){
          // já mostrado como título (ex: ganchos usam texto como título)
        }

        if(collection==='reposts'){
          var extra = el('div', {style:'margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;'});
          if(it.link) extra.appendChild(el('a', {href:it.link, target:'_blank', rel:'noopener', style:'font-size:12.5px;'}, [document.createTextNode('Abrir vídeo original ↗')]));
          var toggleBtn = el('button', {class:'btn-secondary', style:'font-size:12px;padding:5px 10px;'}, [
            document.createTextNode(it.status==='Repostado' ? 'Marcar como pendente' : 'Marcar como repostado')
          ]);
          toggleBtn.addEventListener('click', function(item){ return function(){
            var copy = Object.assign({}, item);
            copy.status = copy.status==='Repostado' ? 'Pendente' : 'Repostado';
            updateItem('reposts', item.id, copy);
            renderApp();
          }; }(it));
          extra.appendChild(toggleBtn);
          card.appendChild(extra);
        }

        list.appendChild(card);
      });
    }
    container.appendChild(list);
  }

  // ganchos: texto funciona como título do card
  function renderGanchosTab(container){
    container.appendChild(el('div', {class:'panel-header'}, [
      el('div', {}, [
        text('div', 'panel-title', 'Ganchos'),
        text('div', 'panel-sub', 'Ideias de gancho para vídeos mudos e falados')
      ]),
      (function(){
        var b = el('button', {class:'btn-primary'}, [text('span',null,'+ Novo Gancho')]);
        b.addEventListener('click', function(){ openAddModal('ganchos'); });
        return b;
      })()
    ]));

    var pills = el('div', {class:'filter-pills', style:'margin-bottom:14px;'});
    ['Todos','Mudo','Falado','Ambos'].forEach(function(o){
      var b = el('button', {class:'btn-secondary'+(state.ganchoFilter===o?' active':'')}, [text('span',null,o)]);
      b.addEventListener('click', function(){ state.ganchoFilter=o; renderApp(); });
      pills.appendChild(b);
    });
    container.appendChild(pills);

    var items = state.data.ganchos.slice();
    if(state.ganchoFilter!=='Todos') items = items.filter(function(it){ return it.tipo===state.ganchoFilter; });

    var list = el('div', {class:'card-list'});
    if(!items.length){
      list.appendChild(el('div', {class:'empty-state'}, [document.createTextNode('Nenhum gancho por aqui ainda.')]));
    } else {
      items.forEach(function(it){
        var card = el('div', {class:'card'});
        var top = el('div', {class:'card-top'});
        top.appendChild(text('div','card-title', it.texto));
        var right = el('div', {style:'display:flex;align-items:center;gap:8px;'});
        right.appendChild(text('span','badge badge-blue', it.tipo));
        var editBtn = el('button', {class:'btn-icon', title:'Editar'}, [document.createTextNode('✎')]);
        editBtn.addEventListener('click', function(item){ return function(){ openEditModal('ganchos', item); }; }(it));
        right.appendChild(editBtn);
        top.appendChild(right);
        card.appendChild(top);
        list.appendChild(card);
      });
    }
    container.appendChild(list);
  }

  function renderFormatosTab(container){
    container.appendChild(el('div', {class:'panel-header'}, [
      el('div', {}, [
        text('div', 'panel-title', 'Formatos'),
        text('div', 'panel-sub', 'O que você usa todo dia: legendas, tipos de conteúdo e specs de vídeo')
      ])
    ]));
    var sub = el('div', {class:'subtabs'});
    [
      {id:'formatosLegenda', label:'Modelos de legenda'},
      {id:'formatosConteudo', label:'Tipos de conteúdo'},
      {id:'formatosVideo', label:'Specs de vídeo'}
    ].forEach(function(s){
      var b = el('button', {class:'btn-secondary'+(state.formatosSub===s.id?' active':'')}, [text('span',null,s.label)]);
      b.addEventListener('click', function(){ state.formatosSub=s.id; renderApp(); });
      sub.appendChild(b);
    });
    container.appendChild(sub);

    var inner = el('div', {});
    renderListTab(inner, state.formatosSub, {hideHeader:true});
    container.appendChild(inner);
  }

  function renderTudoQueSeiTab(container){
    container.appendChild(el('div', {class:'panel-header'}, [
      el('div', {}, [
        text('div', 'panel-title', 'Tudo que sei'),
        text('div', 'panel-sub', 'Base do curso para advogados: cronograma das aulas e todo o material de apoio')
      ])
    ]));
    var sub = el('div', {class:'subtabs'});
    TQS_SUBTABS.forEach(function(s){
      var b = el('button', {class:'btn-secondary'+(state.tqsSub===s.id?' active':'')}, [text('span',null,s.label)]);
      b.addEventListener('click', function(){ state.tqsSub=s.id; renderApp(); });
      sub.appendChild(b);
    });
    container.appendChild(sub);

    var inner = el('div', {});
    renderListTab(inner, state.tqsSub, {hideHeader:true});
    container.appendChild(inner);
  }

  /* ---------------------------------------------------------
     Render: Visão Geral (dashboard)
  --------------------------------------------------------- */
  var MESES_LONGOS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var DIAS_SEMANA_LONGOS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  function renderVisaoGeralTab(container){
    var now = new Date();
    var h = now.getHours();
    var saudacao = h < 12 ? 'Bom dia' : (h < 18 ? 'Boa tarde' : 'Boa noite');
    var greeting = el('div', {class:'dash-greeting'});
    greeting.appendChild(text('div', 'dg-date', DIAS_SEMANA_LONGOS[now.getDay()]+', '+now.getDate()+' de '+MESES_LONGOS[now.getMonth()]));
    greeting.appendChild(text('h2', null, saudacao+', Leonam.'));
    greeting.appendChild(text('p', null, 'Aqui está a visão geral da Central de Conteúdo.'));
    container.appendChild(greeting);

    var grid = el('div', {class:'dash-grid'});
    var formatosTotal = (state.data.formatosLegenda||[]).length + (state.data.formatosConteudo||[]).length + (state.data.formatosVideo||[]).length;
    var repostsPendentes = (state.data.reposts||[]).filter(function(r){ return r.status==='Pendente'; }).length;
    var tqsKeys = ['cronogramaAulas','tsVendas','tsReels','tsDeverCasa','tsParcerias','tsStories','tsCasinha','tsDicas','tsJusfy','tsOferta'];
    var tqsTotal = tqsKeys.reduce(function(sum,k){ return sum + (state.data[k]||[]).length; }, 0);

    var cards = [
      {id:'posts', icon:'📅', label:'Posts', total:(state.data.posts||[]).length, sub:'no calendário'},
      {id:'stories', icon:'📱', label:'Stories', total:(state.data.stories||[]).length, sub:'no calendário'},
      {id:'teses', icon:'⚖️', label:'Teses', total:(state.data.teses||[]).length, sub:'cadastradas'},
      {id:'pautas', icon:'🎬', label:'Pautas & Roteiros', total:(state.data.pautas||[]).length, sub:'na lista'},
      {id:'formatos', icon:'🧩', label:'Formatos', total:formatosTotal, sub:'modelos salvos'},
      {id:'reposts', icon:'🔁', label:'Reposts', total:(state.data.reposts||[]).length, sub:repostsPendentes+' pendente'+(repostsPendentes===1?'':'s')},
      {id:'ganchos', icon:'🪝', label:'Ganchos', total:(state.data.ganchos||[]).length, sub:'salvos'},
      {id:'tudoquesei', icon:'🧠', label:'Tudo que sei', total:tqsTotal, sub:'anotações'}
    ];
    cards.forEach(function(c){
      var card = el('div', {class:'dash-card'});
      card.appendChild(el('h3', {}, [el('span', {class:'dash-icon'}, [document.createTextNode(c.icon)]), document.createTextNode(' '+c.label)]));
      card.appendChild(text('div', 'dash-total', String(c.total)));
      card.appendChild(text('div', 'dash-sub', c.sub));
      card.addEventListener('click', function(){ state.tab = c.id; renderApp(); });
      grid.appendChild(card);
    });
    container.appendChild(grid);
  }

  /* ---------------------------------------------------------
     Render principal
  --------------------------------------------------------- */
  function renderApp(){
    renderTabsNav();
    var app = document.getElementById('app');
    app.innerHTML = '';

    if(state.tab==='visaogeral'){
      renderVisaoGeralTab(app);
    } else if(state.tab==='posts'){
      renderCalendarTab(app, 'posts');
    } else if(state.tab==='stories'){
      renderCalendarTab(app, 'stories');
    } else if(state.tab==='teses'){
      renderListTab(app, 'teses', {
        subtitle:'Base de teses recorrentes do escritório',
        search:{ placeholder:'Buscar por título, área ou tag…', get:function(){return state.teseSearch;}, set:function(v){state.teseSearch=v;} }
      });
    } else if(state.tab==='pautas'){
      renderListTab(app, 'pautas', {
        subtitle:'Pautas a gravar e roteiros completos',
        search:{ placeholder:'Buscar pauta…', get:function(){return state.pautaSearch;}, set:function(v){state.pautaSearch=v;} }
      });
    } else if(state.tab==='formatos'){
      renderFormatosTab(app);
    } else if(state.tab==='reposts'){
      renderListTab(app, 'reposts', {
        subtitle:'Vídeos antigos para repostar',
        filter:{ key:'status', options:['Todos','Pendente','Repostado'], get:function(){return state.repostFilter;}, set:function(v){state.repostFilter=v;} }
      });
    } else if(state.tab==='ganchos'){
      renderGanchosTab(app);
    } else if(state.tab==='tudoquesei'){
      renderTudoQueSeiTab(app);
    }
    closeSidebarMobile();
  }

  function closeSidebarMobile(){
    var sb = document.getElementById('sidebar');
    var bd = document.getElementById('sidebarBackdrop');
    if(sb) sb.classList.remove('open');
    if(bd) bd.classList.remove('show');
  }
  function openSidebarMobile(){
    var sb = document.getElementById('sidebar');
    var bd = document.getElementById('sidebarBackdrop');
    if(sb) sb.classList.add('open');
    if(bd) bd.classList.add('show');
  }

  /* ---------------------------------------------------------
     Export / Import
  --------------------------------------------------------- */
  document.getElementById('btnExport').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(state.data, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    a.href = url;
    a.download = 'central-conteudo-backup-'+toISO(d)+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Backup exportado.');
  });

  document.getElementById('btnSync').addEventListener('click', openSyncModal);

  document.getElementById('btnImport').addEventListener('click', function(){
    document.getElementById('fileImport').click();
  });
  document.getElementById('fileImport').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(!confirm('Importar este backup vai substituir os dados atuais salvos neste navegador. Continuar?')) return;
        state.data = Object.assign(defaultData(), parsed);
        var d = defaultData();
        Object.keys(d).forEach(function(k){ if(!state.data[k]) state.data[k]=[]; });
        saveState();
        renderApp();
        toast('Backup importado com sucesso.');
      }catch(err){
        alert('Não foi possível ler este arquivo. Verifique se é um backup exportado por este site.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('sidebarToggleBtn').addEventListener('click', openSidebarMobile);
  document.getElementById('sidebarCloseBtn').addEventListener('click', closeSidebarMobile);
  document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebarMobile);

  /* ---------------------------------------------------------
     Início
  --------------------------------------------------------- */
  loadState();
  renderApp();
  renderSyncUI();
  initSync();
})();
</script>
